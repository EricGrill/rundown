[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rundown"
version = "0.1.0"
description = "Local-first CLI/TUI to rank and present your best GitHub repos with clear metrics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["github", "cli", "tui", "repos", "presentation"]
authors = [
    { name = "Eric Grill" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "textual>=0.79.0",
    "rich>=13.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
rundown = "rundown.cli:app"
rd = "rundown.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rundown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
