name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and pinned development tools
        run: python -m pip install --disable-pip-version-check -c scripts/ci-constraints.txt -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Typecheck
        run: python -m pyright --pythonpath "$(command -v python)"
      - name: Verify deterministic demo UI
        run: python scripts/capture_tui.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned build frontend
        run: python -m pip install --disable-pip-version-check build==1.3.0
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify artifacts and bundled fixtures
        run: python scripts/verify_release.py dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/rundown-wheel-test
          /tmp/rundown-wheel-test/bin/pip install -c scripts/ci-constraints.txt dist/*.whl
          /tmp/rundown-wheel-test/bin/rd --help
          /tmp/rundown-wheel-test/bin/python -c "from rundown.demo import load_demo_repositories; assert len(load_demo_repositories()) == 3"
      - uses: actions/upload-artifact@v7
        with:
          name: rundown-distributions
          path: dist/
          if-no-files-found: error
