[paths]
repo_root = "./repos"
wiki_root = "./wiki"
database = "./data/rundown.sqlite"
logs = "./logs"
exports = "./exports"

[github]
use_gh_cli = true
# Keep private starred repositories out of the local catalog unless explicitly enabled.
include_private = false

[scoring]
preferred_languages = ["Python", "JavaScript", "TypeScript", "Go", "Rust"]
# Add projects you want research to relate to.
active_projects = []

[execution]
prefer_docker = true
require_confirmation_for_unknown_commands = true
timeout_seconds = 120

[research]
# auto uses this explicit order. An explicit provider never falls back.
# See docs/research-harnesses.md for custom commands and provenance.
provider = "auto"
fallback = ["claude", "gemini", "codex"]
# Omit model to preserve the CLI default and its own authentication.
# model = "your-model-id"
# Customize locally; do not commit private work or personal context.
profile = "I am interested in useful software, developer tools, and automation."
timeout_seconds = 180
max_context_chars = 60000

[tui]
default_filter = "not_archived"
default_sort = "starred_at"

[cards]
# Each repository remembers the view you choose with v.
default_view = "host"
audience = "Developers exploring useful repositories"
tone = "Plain, concise, conversational"
duration_seconds = 90

[cards.host]
sections = ["hook", "what_it_is", "talking_points", "why_now", "demo", "risks", "recommendation", "sources"]
word_limit = 60

[cards.research]
sections = ["what_it_is", "analogy", "use_cases", "personal_fit", "interest", "how_it_works", "practical_uses", "strengths", "risks", "setup", "maturity", "questions", "recommendation", "sources"]
word_limit = 120
